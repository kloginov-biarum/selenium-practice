<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CineBook - Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
    <a href="index.html" class="logo" id="logo" data-test-id="logo">CineBook</a>
    <nav>
        <a href="index.html" id="nav-home" data-test-id="nav-home">Movies</a>
        <div id="user-info"></div>
    </nav>
</header>

<main>
    <form class="form-container" id="login-form" novalidate>
        <h1>Login</h1>

        <div id="form-alert" class="alert alert-error hidden" data-test-id="form-alert"></div>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" data-test-id="username" autocomplete="username">
            <div class="form-error" id="username-error" data-test-id="username-error"></div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" data-test-id="password" autocomplete="current-password">
            <div class="form-error" id="password-error" data-test-id="password-error"></div>
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" id="remember" name="remember" data-test-id="remember"> Remember me
            </label>
        </div>

        <button type="submit" class="btn btn-full" id="login-btn" data-test-id="login-btn">Login</button>

        <div class="form-link">
            Don't have an account? <a href="register.html" id="link-to-register" data-test-id="link-to-register">Sign up</a>
        </div>
    </form>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
    document.getElementById('login-form').addEventListener('submit', e => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        document.getElementById('username-error').textContent = '';
        document.getElementById('password-error').textContent = '';
        hideAlert('form-alert');

        let hasError = false;
        if (!username) {
            document.getElementById('username-error').textContent = 'Username is required';
            hasError = true;
        }
        if (!password) {
            document.getElementById('password-error').textContent = 'Password is required';
            hasError = true;
        }
        if (hasError) return;

        const users = Storage.getUsers();
        const user = users.find(u => u.username === username && u.password === password);

        if (!user) {
            showAlert('form-alert', 'Invalid username or password', 'error');
            return;
        }

        Storage.setCurrentUser(user.username);
        window.location.href = 'profile.html';
    });
</script>
</body>
</html>
