<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CineBook - Register</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
    <a href="index.html" class="logo" id="logo" data-test-id="logo">CineBook</a>
    <nav>
        <a href="index.html" id="nav-home" data-test-id="nav-home">Movies</a>
        <div id="user-info"></div>
    </nav>
</header>

<main>
    <form class="form-container" id="register-form" novalidate>
        <h1>Create account</h1>

        <div id="form-alert" class="alert alert-error hidden" data-test-id="form-alert"></div>

        <div class="form-row">
            <div class="form-group">
                <label for="first-name">First name</label>
                <input type="text" id="first-name" name="firstName" data-test-id="first-name">
                <div class="form-error" id="first-name-error" data-test-id="first-name-error"></div>
            </div>
            <div class="form-group">
                <label for="last-name">Last name</label>
                <input type="text" id="last-name" name="lastName" data-test-id="last-name">
                <div class="form-error" id="last-name-error" data-test-id="last-name-error"></div>
            </div>
        </div>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" data-test-id="username">
            <div class="form-error" id="username-error" data-test-id="username-error"></div>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" data-test-id="email">
            <div class="form-error" id="email-error" data-test-id="email-error"></div>
        </div>

        <div class="form-group">
            <label for="phone">Phone (optional)</label>
            <input type="tel" id="phone" name="phone" data-test-id="phone">
            <div class="form-error" id="phone-error" data-test-id="phone-error"></div>
        </div>

        <div class="form-group">
            <label for="birthdate">Date of birth</label>
            <input type="date" id="birthdate" name="birthdate" data-test-id="birthdate">
            <div class="form-error" id="birthdate-error" data-test-id="birthdate-error"></div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" data-test-id="password">
            <div class="form-error" id="password-error" data-test-id="password-error"></div>
        </div>

        <div class="form-group">
            <label for="password-confirm">Confirm password</label>
            <input type="password" id="password-confirm" name="passwordConfirm" data-test-id="password-confirm">
            <div class="form-error" id="password-confirm-error" data-test-id="password-confirm-error"></div>
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" id="terms" name="terms" data-test-id="terms"> I agree to the terms
            </label>
            <div class="form-error" id="terms-error" data-test-id="terms-error"></div>
        </div>

        <button type="submit" class="btn btn-full" id="register-btn" data-test-id="register-btn">Sign up</button>

        <div class="form-link">
            Already have an account? <a href="login.html" id="link-to-login" data-test-id="link-to-login">Login</a>
        </div>
    </form>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
    document.getElementById('register-form').addEventListener('submit', e => {
        e.preventDefault();
        const fields = ['first-name', 'last-name', 'username', 'email', 'phone', 'birthdate', 'password', 'password-confirm', 'terms'];
        fields.forEach(f => { document.getElementById(f + '-error').textContent = ''; });
        hideAlert('form-alert');

        const firstName = document.getElementById('first-name').value.trim();
        const lastName = document.getElementById('last-name').value.trim();
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const birthdate = document.getElementById('birthdate').value;
        const password = document.getElementById('password').value;
        const passwordConfirm = document.getElementById('password-confirm').value;
        const terms = document.getElementById('terms').checked;

        const errors = {};
        if (firstName.length < 2) errors['first-name'] = 'At least 2 characters';
        if (lastName.length < 2) errors['last-name'] = 'At least 2 characters';
        if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) errors['username'] = '3-20 chars, letters/digits/underscore';
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errors['email'] = 'Invalid email';
        if (phone && !/^[\d\s+()-]{7,}$/.test(phone)) errors['phone'] = 'Invalid phone';
        if (!birthdate) errors['birthdate'] = 'Date of birth required';
        else {
            const age = (new Date() - new Date(birthdate)) / (365.25 * 24 * 3600 * 1000);
            if (age < 13) errors['birthdate'] = 'You must be at least 13';
        }
        if (password.length < 6) errors['password'] = 'Password must be at least 6 characters';
        if (password !== passwordConfirm) errors['password-confirm'] = 'Passwords do not match';
        if (!terms) errors['terms'] = 'You must accept the terms';

        const users = Storage.getUsers();
        if (users.some(u => u.username === username)) errors['username'] = 'Username already taken';
        if (users.some(u => u.email === email)) errors['email'] = 'Email already registered';

        if (Object.keys(errors).length > 0) {
            Object.keys(errors).forEach(f => { document.getElementById(f + '-error').textContent = errors[f]; });
            showAlert('form-alert', 'Please fix the errors above', 'error');
            return;
        }

        users.push({ firstName, lastName, username, email, phone, birthdate, password });
        Storage.saveUsers(users);
        Storage.setCurrentUser(username);
        window.location.href = 'profile.html';
    });
</script>
</body>
</html>
